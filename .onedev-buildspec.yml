version: 40
jobs:
- name: build
  steps:
  - !CheckoutStep
    name: Checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !SetupCacheStep
    name: Cargo Cache
    key: '@property:cache_key@'
    paths:
    - ./target
    uploadStrategy: UPLOAD_IF_NOT_HIT
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Version
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        REGISTRY_URL='@server_url@' \
        IMAGE='@server@/@project_path@/@project_name@' \
        REGISTRY_USER='@job_token@' \
        REGISTRY_PASSWORD='@secret:publish_token@' \
        BRANCH='@branch@' \
        sh ci/build-version.sh
    condition: SUCCESSFUL
    optional: false
  - !SetBuildVersionStep
    name: Set Version
    buildVersion: '@file:build-info/version@'
    condition: SUCCESSFUL
    optional: false
  - !BuildImageStep
    name: Docker
    output: !RegistryOutput
      tags: '@file:build-info/image-tags@'
    registryLogins:
    - registryUrl: '@server_url@'
      userName: '@job_token@'
      passwordSecret: publish_token
    moreOptions: --target release --build-arg JUSTENCRYPT_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger
    projects: justencrypt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
