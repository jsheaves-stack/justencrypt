openapi: 3.0.3
info:
  title: JustEncrypt API
  version: 0.1.0
  description: |
    API specification for the JustEncrypt file encryption service.

    **Error bodies.** Every error response has an [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details body (`application/problem+json`, schema `Problem`): `type` is always `about:blank`, `title` is the status's reason phrase, `status` repeats the status code, and `detail` says what went wrong. Besides the errors each route lists, any route can answer: no matching route (`404`), a method the path doesn't support (`405`, with the supported methods in `Allow`), a malformed JSON body (`400`), a missing or mistyped JSON field or query parameter (`422`), and a JSON body over `JUSTENCRYPT_LIMITS_JSON` (`413`).

    **JSON requests.** Every request with a JSON body must send `Content-Type: application/json`; without it the request is refused with `415`.

    **Timestamps.** Folder and file dates are UTC, formatted as `YYYY-MM-DD HH:MM:SS` with no time-zone marker.

    **Response headers.** Every response carries `Cache-Control: no-store`, `Referrer-Policy: no-referrer`, `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN`, `Permissions-Policy: interest-cohort=()` and `Strict-Transport-Security: max-age=31536000`, and no `Server` header.

    **HTTPS.** The server speaks plain HTTP and is meant to run behind a reverse proxy that terminates TLS. CORS headers are sent only to the origin configured in `JUSTENCRYPT_ALLOW_ORIGIN`, which may then send cookies.

    **Admin routes.** The `/admin` routes exist only when `JUSTENCRYPT_ADMIN_API_KEY` is set; otherwise they answer `404`.

    **Busy users.** Any route that needs a session can answer `429` when the user's own requests in progress kept it waiting for longer than `JUSTENCRYPT_DB_CONNECTION_TIMEOUT_SECONDS`, for one of the user's database connections or (with `JUSTENCRYPT_MAX_BLOCKING_THREADS_PER_USER` set) blocking threads; the request can be retried later. Routes list `429` only for their own, more specific limits.
servers:
  - url: /
    description: Relative server URL
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 'Session cookie set by `POST /session`. A session expires after `JUSTENCRYPT_SESSION_IDLE_TIMEOUT_SECONDS` without a request (default 3600) or `JUSTENCRYPT_SESSION_MAX_LIFETIME_SECONDS` after login (default 604800), whichever comes first; requests with an expired session get `401`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details, the body of every error response.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          description: The status code's reason phrase.
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: What went wrong.
          example: Not found
    ServerInfo:
      type: object
      properties:
        name:
          type: string
          description: The name of the API.
        version:
          type: string
          description: The semver version of the API.
    CreateSession:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The username of the user.
        password:
          type: string
          format: password
          description: The secure passphrase/password (must meet minimum score).
    PatchFileRequest:
      type: object
      additionalProperties: false
      description: At least one field is required. Unknown fields are rejected with `422`.
      properties:
        parent_folder_path:
          type: string
          description: 'The new logical parent folder path to move the file to. Missing folders are created. Each folder name must be 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
        file_name:
          type: string
          description: 'The new logical name for the file: 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
    Folder:
      type: object
      required:
        - type
        - file_name
      properties:
        type:
          type: string
          enum: [Folder]
          description: Whether the entry is a file or a folder.
        file_name:
          type: string
          description: The logical name of the folder.
        file_size:
          type: integer
          format: int64
          nullable: true
          description: The total size of all files within the folder and its subfolders.
        created_date:
          type: string
          nullable: true
          example: '2026-09-30 23:47:05'
          description: When the folder was created (UTC, `YYYY-MM-DD HH:MM:SS`).
        last_modified_date:
          type: string
          nullable: true
          example: '2026-09-30 23:47:05'
          description: When the folder was last modified (UTC, `YYYY-MM-DD HH:MM:SS`).
        file_count:
          type: integer
          format: int64
          description: The total number of files within the folder and its subfolders.
        folder_count:
          type: integer
          format: int64
          description: The total number of subfolders within the folder.
    File:
      type: object
      required:
        - type
        - file_name
      properties:
        type:
          type: string
          enum: [File]
          description: Whether the entry is a file or a folder.
        file_name:
          type: string
          description: The logical name of the file.
        file_extension:
          type: string
          nullable: true
          description: The file extension.
        file_size:
          type: integer
          format: int64
          nullable: true
          description: The total size of the file in bytes.
        created_date:
          type: string
          nullable: true
          example: '2026-09-30 23:47:05'
          description: When the file was created (UTC, `YYYY-MM-DD HH:MM:SS`).
        last_modified_date:
          type: string
          nullable: true
          example: '2026-09-30 23:47:05'
          description: When the file was last modified (UTC, `YYYY-MM-DD HH:MM:SS`).
    FolderContent:
      oneOf:
        - $ref: '#/components/schemas/File'
        - $ref: '#/components/schemas/Folder'
      discriminator:
        propertyName: type
        mapping:
          File: '#/components/schemas/File'
          Folder: '#/components/schemas/Folder'
    ActiveSessionInfo:
      type: object
      properties:
        session_id:
          type: string
          description: The public ID of the session.
        username:
          type: string
          description: The username of the user.
        created_at:
          type: integer
          format: int64
          description: The Unix timestamp when the session was created.
        active_uploads:
          type: array
          items:
            $ref: '#/components/schemas/ActiveFileUpload'
          description: List of currently active chunked uploads for this session.
    ActiveFileUpload:
      type: object
      required:
        - upload_id
        - file_path
        - encoded_file_name
        - last_updated
      properties:
        upload_id:
          type: string
          description: Unique identifier for the chunked upload session.
        file_path:
          type: string
          description: The logical virtual path of the file being uploaded.
        encoded_file_name:
          type: string
          description: The internal encoded filename on disk.
        last_updated:
          type: object
          properties:
            secs_since_epoch:
              type: integer
              format: int64
              description: Seconds since Unix epoch.
            nanos_since_epoch:
              type: integer
              format: int32
              description: Nanosecond offset from seconds since Unix epoch.
          description: Timestamp when the upload was last updated.
    InitUploadResponse:
      type: object
      required:
        - upload_id
      properties:
        upload_id:
          type: string
          description: Unique identifier for the chunked upload session.
security:
  - cookieAuth: []
paths:
  /:
    get:
      summary: Get server information
      description: Returns the API name and semantic version.
      security: []
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
  /session:
    post:
      summary: Create a new session
      description: Logs into an existing account and returns a session cookie. Accounts are created with `POST /admin/users`; logging in never creates one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: 'Session created successfully, cookie provided in headers. The `sid` cookie has a `Max-Age` equal to the session''s maximum lifetime (`JUSTENCRYPT_SESSION_MAX_LIFETIME_SECONDS`). If the user already has the maximum number of sessions (`JUSTENCRYPT_MAX_SESSIONS_PER_USER`), their oldest session is ended.'
        '400':
          description: 'The body isn''t valid JSON, or the username or password is malformed: usernames are 1-64 bytes with no `/`, `\`, `.`, `:`, `*`, `?`, `"`, `<`, `>`, `|` or control characters, no trailing space, and not a Windows device name such as `CON` or `NUL`; passwords are 1-1024 bytes. Says nothing about whether the account exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'Login failed. The same status and body are returned for a wrong password, an unknown user, and an account that was never set up.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The request has no `Content-Type: application/json` header.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A required field is missing or has the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Destroy the active session
      description: Invalidates the active session identified by the sid cookie, removes that session's unfinished uploads, and expires the sid cookie (sent even when the session was already gone).
      responses:
        '204':
          description: Session successfully destroyed.
        '401':
          description: Unauthorized (missing or invalid session ID).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /file/{file_path}:
    put:
      summary: Upload and encrypt a file (Single-shot)
      description: Uploads a file stream, encrypts it on the fly, and stores it in the sharded filesystem, replacing any file already at that path. Missing parent folders are created. For large files, use the chunked upload endpoints under `/upload`.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual file path where the file will be stored.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File uploaded and encrypted successfully (also when it replaced an existing file).
        '400':
          description: 'The path has no file name (`Missing file name`), or a file or folder name in it is invalid: names must be 1-255 bytes, not `.` or `..`, and contain no `/`, `\`, or control characters. Nothing is stored.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is larger than the maximum file size (`JUSTENCRYPT_LIMITS_FILE`). Nothing is stored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to encrypt or store file).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: Download and decrypt a file
      description: Streams and decrypts the file on the fly based on the logical file path. Supports Range requests for partial content. If the stored file turns out to be shorter than its recorded size, or the client reads nothing for `JUSTENCRYPT_DOWNLOAD_STALL_TIMEOUT_SECONDS`, the response is cut short (the connection is closed before `Content-Length` bytes arrive) and the server logs it.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the requested file.
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: A single byte range, as `bytes=start-end`, `bytes=start-` or `bytes=-suffixLength` (the last N bytes). Several ranges, or a unit other than `bytes`, are ignored and the whole file is sent with 200.
      responses:
        '200':
          description: 'Decrypted file stream (Full content). An empty file is returned with `Content-Length: 0` and no body.'
          headers:
            Accept-Ranges:
              schema:
                type: string
              description: Indicates support for byte range requests.
            Content-Length:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Decrypted file stream (Partial content).
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
              description: The range of bytes being returned (e.g., bytes 0-1024/2048).
            Content-Length:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: File not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: Range not satisfiable (starts at or past the end of the file, or `bytes=-0`). Every range of an empty file is unsatisfiable.
          headers:
            Content-Range:
              schema:
                type: string
              description: The file's size, as `bytes */<total_size>`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to process or decrypt data).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Move or rename a file
      description: Renames a file, moves it to a different logical folder, or both. The change is all-or-nothing, and destination folders are only created if it succeeds.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the file to modify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFileRequest'
      responses:
        '204':
          description: File moved or renamed successfully (also when nothing actually changes).
        '400':
          description: The body isn't valid JSON, a name is invalid, or neither field is given (`Nothing to change`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The file doesn't exist. Nothing is changed or created.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A file with the target name already exists in the target folder. Nothing is changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The request has no `Content-Type: application/json` header.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request body has an unknown field, or a field has the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to move or rename file).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a file
      description: Permanently deletes the file metadata and physical encrypted chunks from the server.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the file to delete.
      responses:
        '204':
          description: File successfully deleted.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: File not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to remove physical file or database entry).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /upload/initiate/{file_path}:
    post:
      summary: Initialize a chunked upload
      description: Starts a new chunked upload session for a file. Returns an upload_id to be used in subsequent chunk uploads and finalization. File and folder names in the path are checked here and again at finalization. An upload idle for `JUSTENCRYPT_UPLOAD_TTL_SECONDS` (default 86400) is removed.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual file path where the file will eventually be stored.
      responses:
        '200':
          description: Upload initialized successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'
        '400':
          description: 'A file or folder name in the path is invalid: names must be 1-255 bytes, not `.` or `..`, and contain no `/`, `\`, or control characters.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The session already has `JUSTENCRYPT_MAX_ACTIVE_UPLOADS` uploads in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to initialize encryption).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /upload/chunk/{upload_id}:
    put:
      summary: Upload a file chunk
      description: Uploads one or more consecutive 64KB chunks of the file, starting at the specified offset. Every chunk except the last chunk of the file must be exactly 64KB. A single request may carry at most `JUSTENCRYPT_LIMITS_FILE_CHUNK` bytes (default 32MiB), and data may not extend past the maximum file size. Re-uploading a chunk replaces it.
      parameters:
        - in: path
          name: upload_id
          required: true
          schema:
            type: string
          description: The unique identifier for the chunked upload session.
        - in: query
          name: offset
          required: true
          schema:
            type: integer
            format: int64
          description: The byte offset in the original plaintext file where this chunk starts. Must be a multiple of 65536 (64KB).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk uploaded successfully.
        '400':
          description: The offset is not a multiple of 65536.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Upload session not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is larger than the per-request chunk limit, or the data would extend past the maximum file size. Chunks written before the limit was reached are kept.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`offset` is not a non-negative integer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to encrypt or store chunk).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /upload/finalize/{upload_id}:
    post:
      summary: Finalize a chunked upload
      description: Completes the chunked upload process. Verifies that the uploaded chunks make up exactly `total_size` bytes and adds the file to the user's storage. If verification fails, the upload stays active so the client can upload the missing data and finalize again.
      parameters:
        - in: path
          name: upload_id
          required: true
          schema:
            type: string
          description: The unique identifier for the chunked upload session.
        - in: query
          name: total_size
          required: true
          schema:
            type: integer
            format: int64
          description: The total size of the original plaintext file in bytes. It must match the uploaded data exactly.
      responses:
        '201':
          description: File finalized and stored successfully, replacing any file already at that path.
        '400':
          description: |
            The uploaded data does not match `total_size`. The body is one of:
            - `Missing chunks: [0, 1, ...]`, listing at most 100 chunk indexes, followed by `(and N more)` if more are missing.
            - `Chunk N is incomplete: expected 65536 bytes, got M`, for a short chunk before the last one.
            - `total_size does not match uploaded data`, when the last chunk's length or the number of chunks doesn't fit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Upload session not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: '`total_size` is larger than the maximum file size (`JUSTENCRYPT_LIMITS_FILE`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`total_size` is not a non-negative integer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to finalize or store file metadata).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /admin/users:
    post:
      summary: Create a user account (Admin)
      description: Creates a user's directory and encrypted database. This is the only way to create an account. A directory that exists without a database is set up normally. Requires admin API key.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: '1-64 bytes; no `/`, `\`, `.`, `:`, `*`, `?`, `"`, `<`, `>`, `|` or control characters, no trailing space, and not a Windows device name such as `CON` or `NUL`.'
                password:
                  type: string
                  description: 1-1024 bytes; must meet `JUSTENCRYPT_MINIMUM_PASSWORD_SECURITY_SCORE`.
      responses:
        '201':
          description: Account created.
        '400':
          description: The body isn't valid JSON, the username is malformed, or the password is malformed or too weak.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid admin API key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The request has no `Content-Type: application/json` header.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: An account with this username already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A required field is missing or has the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /admin/session:
    get:
      summary: List all active sessions (Admin)
      description: Returns a list of all active user sessions with their metadata. Requires admin API key.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveSessionInfo'
        '401':
          description: Invalid or missing admin API key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /admin/session/{session_id}:
    delete:
      summary: Forcefully terminate a session (Admin)
      description: Invalidate a user session by its public session ID. Requires admin API key.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          description: The public ID of the session to terminate.
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: Session terminated successfully.
        '401':
          description: Invalid or missing admin API key, or session not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /folder/{folder_path}:
    put:
      summary: Create a folder
      description: Creates a folder, along with any missing parent folders. Succeeds with `201` also when the folder already exists.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to create.
      responses:
        '201':
          description: The folder exists (created now or already there).
        '400':
          description: 'A folder name in the path is invalid: names must be 1-255 bytes, not `.` or `..`, and contain no `/`, `\`, or control characters. Nothing is created.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      summary: List or download a folder
      description: |
        Without `download`, returns the files and folders directly inside the specified folder, in no particular order, without pagination.

        With `download` (`GET /folder/{folder_path}?download`), returns the folder and everything below it as an uncompressed TAR archive (ustar, with PAX headers for long or non-ASCII paths and files of 8 GiB or more). Entries sit under a directory named after the folder, or after the user for the root folder. Every folder gets an entry, including empty ones.

        The archive is a snapshot of the folder when the download started. Files added, renamed or moved during the download don't change it. If a file is overwritten or deleted before the download reaches it, or the client reads nothing for `JUSTENCRYPT_DOWNLOAD_STALL_TIMEOUT_SECONDS`, the archive ends early. The body is then shorter than `Content-Length`, which clients report as a failed download.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder. Empty for the root folder.
        - in: query
          name: download
          required: false
          allowEmptyValue: true
          schema:
            type: string
          description: Present, with or without a value (`?download`, `?download=1`), to download the folder as a TAR archive instead of listing it.
      responses:
        '200':
          description: The folder's contents as a JSON array or, with `download`, as a TAR archive.
          headers:
            Content-Disposition:
              description: 'With `download`: `attachment`, naming the file `<folder>.tar`.'
              schema:
                type: string
            Content-Length:
              description: 'With `download`: the exact length of the archive, known before it streams.'
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderContent'
            application/x-tar:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (e.g., invalid path).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Folder not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'With `download`: the server is already running `JUSTENCRYPT_MAX_ACTIVE_DOWNLOADS` folder downloads (when set), or the user''s own folder downloads (up to half of `JUSTENCRYPT_MAX_DB_CONNECTIONS_PER_USER`) stayed busy for `JUSTENCRYPT_DB_CONNECTION_TIMEOUT_SECONDS`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to read folder contents).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a folder recursively
      description: Recursively deletes the folder, sub-folders, and all encrypted files and thumbnails inside it. The database changes are all-or-nothing; the encrypted data is removed after they commit. The root folder can't be deleted.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to delete.
      responses:
        '204':
          description: Complete recursive deletion successful.
        '400':
          description: The path is the root folder (`Cannot delete the root folder`), or is otherwise invalid. Nothing is deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Folder not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to remove files/folders).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Rename or move a folder
      description: Renames a folder, moves it to a different parent folder path, or both. The change is all-or-nothing, and destination folders are only created if it succeeds. The root folder can't be renamed or moved, and a folder can't be moved into itself or its subfolders.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to modify.
      requestBody:
        description: The patch data containing the new folder name or new parent folder path.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one field is required. Unknown fields are rejected with `422`.
              properties:
                folder_name:
                  type: string
                  description: 'New name for the folder: 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
                parent_folder_path:
                  type: string
                  description: 'New destination folder path. Missing folders are created. Each folder name must be 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
      responses:
        '204':
          description: Folder successfully renamed/moved (also when nothing actually changes).
        '400':
          description: The body isn't valid JSON, a name is invalid, neither field is given, or the change targets the root folder or moves a folder into its own subtree.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The folder doesn't exist. Nothing is changed or created.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A folder with the target name already exists in the target folder. Nothing is changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The request has no `Content-Type: application/json` header.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request body has an unknown field, or a field has the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /thumbnail/{file_path}:
    get:
      summary: Get or generate a thumbnail
      description: Fetches a thumbnail for an image file (JPEG, PNG, GIF, WebP or AVIF, judged by the extension). If the thumbnail does not exist, it securely decrypts the original, checks that its content matches the extension, resizes it to fit within 150x150, encrypts the thumbnail to a cache, and returns it. The thumbnail has the same format as the original.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical path of the original image file.
      responses:
        '200':
          description: The thumbnail, with the original image's content type.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Original image file not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type (the extension isn't a supported image format, or the file's content isn't in the format its extension names).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The image is too large to process (wider or taller than 16384 pixels, or needs more memory to decode than JUSTENCRYPT_THUMBNAIL_MAX_DECODE_MEMORY).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error (Failed to generate or process thumbnail).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response