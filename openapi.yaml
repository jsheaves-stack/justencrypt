openapi: 3.0.3
info:
  title: JustEncrypt API
  version: 1.0.0
  description: API specification for the JustEncrypt file encryption service.
servers:
  - url: /
    description: Relative server URL
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 'Session cookie set by `POST /session`. A session expires after `JUSTENCRYPT_SESSION_IDLE_TIMEOUT_SECONDS` without a request (default 3600) or `JUSTENCRYPT_SESSION_MAX_LIFETIME_SECONDS` after login (default 604800), whichever comes first; requests with an expired session get `401`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
  schemas:
    ServerInfo:
      type: object
      properties:
        name:
          type: string
          description: The name of the API.
        version:
          type: string
          description: The semver version of the API.
    CreateSession:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The username of the user.
        password:
          type: string
          format: password
          description: The secure passphrase/password (must meet minimum score).
    PatchFileRequest:
      type: object
      additionalProperties: false
      description: At least one field is required. Unknown fields are rejected with `422`.
      properties:
        parent_folder_path:
          type: string
          description: 'The new logical parent folder path to move the file to. Missing folders are created. Each folder name must be 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
        file_name:
          type: string
          description: 'The new logical name for the file: 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
    Folder:
      type: object
      required:
        - file_name
      properties:
        file_name:
          type: string
          description: The logical name of the folder.
        file_size:
          type: integer
          format: int64
          nullable: true
          description: The total size of all files within the folder and its subfolders.
        created_date:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the folder was created.
        last_modified_date:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the folder was last modified.
        file_count:
          type: integer
          format: int64
          description: The total number of files within the folder and its subfolders.
        folder_count:
          type: integer
          format: int64
          description: The total number of subfolders within the folder.
    File:
      type: object
      required:
        - file_name
      properties:
        file_name:
          type: string
          description: The logical name of the file.
        file_extension:
          type: string
          nullable: true
          description: The file extension.
        file_size:
          type: integer
          format: int64
          nullable: true
          description: The total size of the file in bytes.
        created_date:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the file was created.
        last_modified_date:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the file was last modified.
    FolderContent:
      oneOf:
        - $ref: '#/components/schemas/File'
        - $ref: '#/components/schemas/Folder'
      discriminator:
        propertyName: type
        mapping:
          File: '#/components/schemas/File'
          Folder: '#/components/schemas/Folder'
    ActiveSessionInfo:
      type: object
      properties:
        session_id:
          type: string
          description: The public ID of the session.
        username:
          type: string
          description: The username of the user.
        created_at:
          type: integer
          format: int64
          description: The Unix timestamp when the session was created.
        active_uploads:
          type: array
          items:
            $ref: '#/components/schemas/ActiveFileUpload'
          description: List of currently active chunked uploads for this session.
    ActiveFileUpload:
      type: object
      required:
        - upload_id
        - file_path
        - encoded_file_name
        - last_updated
      properties:
        upload_id:
          type: string
          description: Unique identifier for the chunked upload session.
        file_path:
          type: string
          description: The logical virtual path of the file being uploaded.
        encoded_file_name:
          type: string
          description: The internal encoded filename on disk.
        last_updated:
          type: object
          properties:
            secs_since_epoch:
              type: integer
              format: int64
              description: Seconds since Unix epoch.
            nanos_since_epoch:
              type: integer
              format: int32
              description: Nanosecond offset from seconds since Unix epoch.
          description: Timestamp when the upload was last updated.
    InitUploadResponse:
      type: object
      required:
        - upload_id
      properties:
        upload_id:
          type: string
          description: Unique identifier for the chunked upload session.
security:
  - cookieAuth: []
paths:
  /:
    get:
      summary: Get server information
      description: Returns the API name and semantic version.
      security: []
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
  /session:
    post:
      summary: Create a new session
      description: Logs into an existing account and returns a session cookie. Accounts are created with `POST /admin/users`; logging in never creates one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: 'Session created successfully, cookie provided in headers. The `sid` cookie has a `Max-Age` equal to the session''s maximum lifetime (`JUSTENCRYPT_SESSION_MAX_LIFETIME_SECONDS`). If the user already has the maximum number of sessions (`JUSTENCRYPT_MAX_SESSIONS_PER_USER`), their oldest session is ended.'
        '400':
          description: 'The username or password is malformed: usernames are 1-64 bytes with no `/`, `\`, `.` or control characters, passwords are 1-1024 bytes. Says nothing about whether the account exists.'
        '401':
          description: 'Login failed. The same status and body are returned for a wrong password, an unknown user, and an account that was never set up.'
    delete:
      summary: Destroy the active session
      description: Invalidates the active session identified by the sid cookie, removes that session's unfinished uploads, and expires the sid cookie (sent even when the session was already gone).
      responses:
        '204':
          description: Session successfully destroyed.
        '401':
          description: Unauthorized (missing or invalid session ID).
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /file/{file_path}:
    put:
      summary: Upload and encrypt a file (Single-shot)
      description: Uploads a file stream, encrypts it on the fly, and stores it in the sharded filesystem. For large files, use the chunked upload endpoints.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual file path where the file will be stored.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File uploaded and encrypted successfully.
        '401':
          description: Unauthorized.
        '413':
          description: The body is larger than the maximum file size (`JUSTENCRYPT_LIMITS_FILE`). Nothing is stored.
        '500':
          description: Internal server error (Failed to encrypt or store file).
    get:
      summary: Download and decrypt a file
      description: Streams and decrypts the file on the fly based on the logical file path. Supports Range requests for partial content.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the requested file.
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: Standard HTTP Range header (e.g., bytes=0-1024).
      responses:
        '200':
          description: 'Decrypted file stream (Full content). An empty file is returned with `Content-Length: 0` and no body.'
          headers:
            Accept-Ranges:
              schema:
                type: string
              description: Indicates support for byte range requests.
            Content-Length:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Decrypted file stream (Partial content).
          headers:
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
              description: The range of bytes being returned (e.g., bytes 0-1024/2048).
            Content-Length:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
        '404':
          description: File not found.
        '416':
          description: Range not satisfiable. Every range of an empty file is unsatisfiable.
          headers:
            Content-Range:
              schema:
                type: string
              description: The file's size, as `bytes */<total_size>`.
        '500':
          description: Internal server error (Failed to process or decrypt data).
    patch:
      summary: Move or rename a file
      description: Renames a file, moves it to a different logical folder, or both. The change is all-or-nothing, and destination folders are only created if it succeeds.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the file to modify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFileRequest'
      responses:
        '204':
          description: File moved or renamed successfully (also when nothing actually changes).
        '400':
          description: An invalid name, or neither field given (`Nothing to change`).
        '401':
          description: Unauthorized.
        '404':
          description: The file doesn't exist. Nothing is changed or created.
        '409':
          description: A file with the target name already exists in the target folder. Nothing is changed.
        '422':
          description: The request body has an unknown field.
        '500':
          description: Internal server error (Failed to move or rename file).
    delete:
      summary: Delete a file
      description: Permanently deletes the file metadata and physical encrypted chunks from the server.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual path of the file to delete.
      responses:
        '204':
          description: File successfully deleted.
        '401':
          description: Unauthorized.
        '404':
          description: File not found.
        '500':
          description: Internal server error (Failed to remove physical file or database entry).
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /file/upload/initiate/{file_path}:
    post:
      summary: Initialize a chunked upload
      description: Starts a new chunked upload session for a file. Returns an upload_id to be used in subsequent chunk uploads and finalization.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical virtual file path where the file will eventually be stored.
      responses:
        '200':
          description: Upload initialized successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'
        '401':
          description: Unauthorized.
        '429':
          description: Too many active uploads.
        '500':
          description: Internal server error (Failed to initialize encryption).
  /file/upload/chunk/{upload_id}:
    put:
      summary: Upload a file chunk
      description: Uploads one or more consecutive 64KB chunks of the file, starting at the specified offset. Every chunk except the last chunk of the file must be exactly 64KB. A single request may carry at most `JUSTENCRYPT_LIMITS_FILE_CHUNK` bytes (default 32MiB), and data may not extend past the maximum file size. Re-uploading a chunk replaces it.
      parameters:
        - in: path
          name: upload_id
          required: true
          schema:
            type: string
          description: The unique identifier for the chunked upload session.
        - in: query
          name: offset
          required: true
          schema:
            type: integer
            format: int64
          description: The byte offset in the original plaintext file where this chunk starts. Must be a multiple of 65536 (64KB).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk uploaded successfully.
        '400':
          description: The offset is not a multiple of 65536.
        '401':
          description: Unauthorized.
        '404':
          description: Upload session not found.
        '413':
          description: The body is larger than the per-request chunk limit, or the data would extend past the maximum file size. Chunks written before the limit was reached are kept.
        '500':
          description: Internal server error (Failed to encrypt or store chunk).
  /file/upload/finalize/{upload_id}:
    post:
      summary: Finalize a chunked upload
      description: Completes the chunked upload process. Verifies that the uploaded chunks make up exactly `total_size` bytes and adds the file to the user's storage. If verification fails, the upload stays active so the client can upload the missing data and finalize again.
      parameters:
        - in: path
          name: upload_id
          required: true
          schema:
            type: string
          description: The unique identifier for the chunked upload session.
        - in: query
          name: total_size
          required: true
          schema:
            type: integer
            format: int64
          description: The total size of the original plaintext file in bytes. It must match the uploaded data exactly.
      responses:
        '201':
          description: File finalized and stored successfully.
        '400':
          description: |
            The uploaded data does not match `total_size`. The body is one of:
            - `Missing chunks: [0, 1, ...]`, listing at most 100 chunk indexes, followed by `(and N more)` if more are missing.
            - `Chunk N is incomplete: expected 65536 bytes, got M`, for a short chunk before the last one.
            - `total_size does not match uploaded data`, when the last chunk's length or the number of chunks doesn't fit.
        '401':
          description: Unauthorized.
        '404':
          description: Upload session not found.
        '413':
          description: '`total_size` is larger than the maximum file size (`JUSTENCRYPT_LIMITS_FILE`).'
        '500':
          description: Internal server error (Failed to finalize or store file metadata).
  /admin/users:
    post:
      summary: Create a user account (Admin)
      description: Creates a user's directory and encrypted database. This is the only way to create an account. A directory that exists without a database is set up normally. Requires admin API key.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: 1-64 bytes; no `/`, `\`, `.` or control characters.
                password:
                  type: string
                  description: 1-1024 bytes; must meet `JUSTENCRYPT_MINIMUM_PASSWORD_SECURITY_SCORE`.
      responses:
        '201':
          description: Account created.
        '400':
          description: The username is malformed, or the password is malformed or too weak.
        '401':
          description: Missing or invalid admin API key.
        '409':
          description: An account with this username already exists.
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /admin/session:
    get:
      summary: List all active sessions (Admin)
      description: Returns a list of all active user sessions with their metadata. Requires admin API key.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveSessionInfo'
        '401':
          description: Invalid or missing admin API key.
    options:
      summary: Pre-flight check
      security: []
      responses:
        '204':
          description: CORS pre-flight response
  /admin/session/{session_id}:
    delete:
      summary: Forcefully terminate a session (Admin)
      description: Invalidate a user session by its public session ID. Requires admin API key.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          description: The public ID of the session to terminate.
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: Session terminated successfully.
        '401':
          description: Invalid or missing admin API key, or session not found.
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /folder/{folder_path}:
    put:
      summary: Create a folder
      description: Creates a new logical folder path.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to create.
      responses:
        '201':
          description: Folder created successfully.
        '400':
          description: Bad request (e.g., invalid path).
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error (Failed to create folder).
    get:
      summary: List folder contents
      description: Returns a list of files and folders contained within the specified folder path.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to list.
      responses:
        '200':
          description: JSON array of folder contents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderContent'
        '400':
          description: Bad request (e.g., invalid path).
        '401':
          description: Unauthorized.
        '404':
          description: Folder not found.
        '500':
          description: Internal server error (Failed to read folder contents).
    delete:
      summary: Delete a folder recursively
      description: Recursively deletes the folder, sub-folders, and all encrypted files and thumbnails inside it. The database changes are all-or-nothing; the encrypted data is removed after they commit. The root folder can't be deleted.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to delete.
      responses:
        '204':
          description: Complete recursive deletion successful.
        '400':
          description: The path is the root folder (`Cannot delete the root folder`), or is otherwise invalid. Nothing is deleted.
        '401':
          description: Unauthorized.
        '404':
          description: Folder not found.
        '500':
          description: Internal server error (Failed to remove files/folders).
    patch:
      summary: Rename or move a folder
      description: Renames a folder, moves it to a different parent folder path, or both. The change is all-or-nothing, and destination folders are only created if it succeeds. The root folder can't be renamed or moved, and a folder can't be moved into itself or its subfolders.
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
          description: The logical path of the folder to modify.
      requestBody:
        description: The patch data containing the new folder name or new parent folder path.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one field is required. Unknown fields are rejected with `422`.
              properties:
                folder_name:
                  type: string
                  description: 'New name for the folder: 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
                parent_folder_path:
                  type: string
                  description: 'New destination folder path. Missing folders are created. Each folder name must be 1-255 bytes, not `.` or `..`, and no `/`, `\\`, or control characters.'
      responses:
        '204':
          description: Folder successfully renamed/moved (also when nothing actually changes).
        '400':
          description: An invalid name, neither field given, the root folder, or a move into the folder's own subtree.
        '401':
          description: Unauthorized.
        '404':
          description: The folder doesn't exist. Nothing is changed or created.
        '409':
          description: A folder with the target name already exists in the target folder. Nothing is changed.
        '422':
          description: The request body has an unknown field.
        '500':
          description: Internal server error.
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: folder_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response
  /thumbnail/{file_path}:
    get:
      summary: Get or generate a thumbnail
      description: Fetches a thumbnail for an image file (JPEG, PNG, GIF, WebP or AVIF, judged by the extension). If the thumbnail does not exist, it securely decrypts the original, checks that its content matches the extension, resizes it to fit within 150x150, encrypts the thumbnail to a cache, and returns it. The thumbnail has the same format as the original.
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
          description: The logical path of the original image file.
      responses:
        '200':
          description: The thumbnail, with the original image's content type.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
        '404':
          description: Original image file not found.
        '415':
          description: Unsupported media type (the extension isn't a supported image format, or the file's content isn't in the format its extension names).
        '422':
          description: The image is too large to process (wider or taller than 16384 pixels, or needs more memory to decode than JUSTENCRYPT_THUMBNAIL_MAX_DECODE_MEMORY).
        '500':
          description: Internal server error (Failed to generate or process thumbnail).
    options:
      summary: Pre-flight check
      security: []
      parameters:
        - in: path
          name: file_path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: CORS pre-flight response